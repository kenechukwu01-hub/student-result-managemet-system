{% extends "base.html" %}{% block content %}<section class="formpanel"><p class="eyebrow">RESULT MANAGEMENT</p><h1>Enter examination scores</h1><p class="muted">{{ student.full_name }} · {{ student.student_id }}</p><form method="post" class="grid">
{% for subject in subjects %}<label>{{ subject }} (0–100)<input type="number" name="{{ subject }}" min="0" max="100" step="0.01" required value="{{ student.scores.get(subject,'') }}"></label>{% endfor %}
<div class="buttons"><button class="button primary">Save scores</button><a class="button secondary" href="{{ url_for('index') }}">Cancel</a></div></form></section>{% endblock %}
